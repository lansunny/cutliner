name: cutliner
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cutliner
      POSTGRES_USER: cutliner
      POSTGRES_PASSWORD: ${CUTLINER_DB_PASSWORD:?Launch with scripts/start-studio.ps1 or set a local password}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cutliner -d cutliner"]
      interval: 3s
      timeout: 3s
      retries: 12
volumes:
  pgdata:
